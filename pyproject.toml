[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-agent-harness"
version = "0.0.1"
description = "A bounded, traceable harness for local workspace agents"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["workspace_agent_harness"]

[tool.setuptools.package-data]
workspace_agent_harness = ["benchmark_configs/*.json", "benchmark_configs/*.md"]
