name: Installed runtime regression
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "中文 space %# literal%20"
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: "中文 space %# literal%20"
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate pinned test dependencies
        run: |
          timeout 120s python -m venv "$RUNNER_TEMP/pytest-env"
          timeout 120s "$RUNNER_TEMP/pytest-env/bin/python" -m pip install -r scripts/runtime-ci/requirements.txt
      - name: Build and test installed runtime
        run: '"$RUNNER_TEMP/pytest-env/bin/python" scripts/runtime-ci/run.py --output "$RUNNER_TEMP/runtime-evidence 中文 space %# literal%20"'
      - name: Exercise installed native networking on real x86-64 Linux
        run: |
          out="$RUNNER_TEMP/runtime-evidence 中文 space %# literal%20"
          mkdir "$out/native-linux"
          timeout 800s bash scripts/runtime-ci/native-network-linux.sh "$out/consumer/node_modules/pan-agent" "$out/native-linux" > "$out/native-linux/setup.log" 2>&1 || { tail -100 "$out/native-linux/setup.log"; exit 1; }
      - name: Exercise retained offline Docker from the installed package
        if: matrix.node == '26.7.0'
        run: |
          out="$RUNNER_TEMP/runtime-evidence 中文 space %# literal%20"
          df -h "$out"
          timeout 120s docker pull --platform linux/amd64 python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          timeout 90s node scripts/runtime-ci/docker-offline.mjs "$out/consumer/node_modules/pan-agent" "$out/docker-offline"
      - name: Bundle original evidence paths
        if: always()
        run: |
          mkdir "$RUNNER_TEMP/runtime-upload"
          tar --exclude='./consumer' -czf "$RUNNER_TEMP/runtime-upload/runtime-evidence.tar.gz" -C "$RUNNER_TEMP/runtime-evidence 中文 space %# literal%20" .
          cp "$RUNNER_TEMP/runtime-evidence 中文 space %# literal%20/result.json" "$RUNNER_TEMP/runtime-upload/result.json"
      - name: Preserve raw evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/runtime-upload/runtime-evidence.tar.gz
            ${{ runner.temp }}/runtime-upload/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
